<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Simple Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .navbar .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: none;
        }

        .navbar .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ===== AUTH SECTION ===== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 65px);
            padding: 24px;
        }

        .auth-card {
            background: #1e293b;
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .auth-card .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: #0f172a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #94a3b8;
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
        }

        .tab.active {
            background: #6366f1;
            color: #fff;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* ===== MESSAGES ===== */
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            display: none;
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .dashboard h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #f1f5f9;
        }

        .dashboard .welcome-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        /* ===== ADD TASK ===== */
        .add-task-card {
            background: #1e293b;
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .add-task-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e2e8f0;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-form input,
        .task-form textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            resize: none;
        }

        .task-form input:focus,
        .task-form textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        .task-form textarea {
            height: 80px;
        }

        .add-btn {
            padding: 11px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
            align-self: flex-end;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* ===== TASK LIST ===== */
        .tasks-section h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #e2e8f0;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px 20px;
            transition: border-color 0.2s;
        }

        .task-item:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .task-item .task-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
        }

        .task-item .task-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* ===== LOADING ===== */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">✦ TaskFlow</div>
        <button class="logout-btn" id="logoutBtn" onclick="logout()">Logout</button>
    </nav>

    <!-- AUTH SECTION -->
    <div class="auth-container" id="authSection">
        <div class="auth-card">
            <h2>Welcome to TaskFlow</h2>
            <p class="subtitle">Manage your tasks simply and securely.</p>

            <div class="tabs">
                <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
                <button class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="authMessage" class="message"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password (min 6 characters)</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" minlength="6" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <h1>Your Tasks</h1>
        <p class="welcome-text" id="welcomeText">Manage your daily tasks below.</p>

        <div id="dashMessage" class="message"></div>

        <div class="add-task-card">
            <h3>+ Add New Task</h3>
            <form class="task-form" onsubmit="handleAddTask(event)">
                <input type="text" id="taskTitle" placeholder="Task title" required>
                <textarea id="taskDesc" placeholder="Task description (optional)"></textarea>
                <button type="submit" class="add-btn">Add Task</button>
            </form>
        </div>

        <div class="tasks-section">
            <h3>All Tasks</h3>
            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <p>No tasks yet. Add your first task above!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "";
        let token = localStorage.getItem("token");

        // On page load
        if (token) {
            showDashboard();
        }

        // ===== TAB SWITCHING =====
        function switchTab(tab) {
            hideMessage("authMessage");
            if (tab === "login") {
                document.getElementById("loginTab").classList.add("active");
                document.getElementById("signupTab").classList.remove("active");
                document.getElementById("loginForm").style.display = "block";
                document.getElementById("signupForm").style.display = "none";
            } else {
                document.getElementById("signupTab").classList.add("active");
                document.getElementById("loginTab").classList.remove("active");
                document.getElementById("signupForm").style.display = "block";
                document.getElementById("loginForm").style.display = "none";
            }
        }

        // ===== MESSAGES =====
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = "message " + type;
        }

        function hideMessage(elementId) {
            const el = document.getElementById(elementId);
            el.className = "message";
            el.textContent = "";
        }

        // ===== SIGNUP =====
        async function handleSignup(e) {
            e.preventDefault();
            hideMessage("authMessage");

            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            try {
                const res = await fetch(API + "/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage("authMessage", "Account created! Please login now.", "success");
                    document.getElementById("signupForm").reset();
                    setTimeout(() => switchTab("login"), 1500);
                } else {
                    showMessage("authMessage", data.detail || "Signup failed.", "error");
                }
            } catch (err) {
                showMessage("authMessage", "Network error. Is the server running?", "error");
            }
        }

        // ===== LOGIN =====
        async function handleLogin(e) {
            e.preventDefault();
            hideMessage("authMessage");

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            // Login endpoint expects form data (OAuth2)
            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            try {
                const res = await fetch(API + "/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem("token", token);
                    showDashboard();
                } else {
                    showMessage("authMessage", data.detail || "Invalid credentials.", "error");
                }
            } catch (err) {
                showMessage("authMessage", "Network error. Is the server running?", "error");
            }
        }

        // ===== SHOW DASHBOARD =====
        function showDashboard() {
            document.getElementById("authSection").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("logoutBtn").style.display = "block";
            loadTasks();
        }

        // ===== LOGOUT =====
        function logout() {
            token = null;
            localStorage.removeItem("token");
            document.getElementById("authSection").style.display = "flex";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("logoutBtn").style.display = "none";
            document.getElementById("loginForm").reset();
        }

        // ===== ADD TASK =====
        async function handleAddTask(e) {
            e.preventDefault();
            hideMessage("dashMessage");

            const title = document.getElementById("taskTitle").value;
            const description = document.getElementById("taskDesc").value || "No description";

            try {
                const res = await fetch(API + "/tasks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ title, description })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById("taskTitle").value = "";
                    document.getElementById("taskDesc").value = "";
                    showMessage("dashMessage", "Task added!", "success");
                    setTimeout(() => hideMessage("dashMessage"), 2000);
                    loadTasks();
                } else if (res.status === 401) {
                    showMessage("dashMessage", "Session expired. Please login again.", "error");
                    setTimeout(() => logout(), 1500);
                } else {
                    showMessage("dashMessage", data.detail || "Failed to add task.", "error");
                }
            } catch (err) {
                showMessage("dashMessage", "Network error.", "error");
            }
        }

        // ===== LOAD TASKS =====
        async function loadTasks() {
            const taskList = document.getElementById("taskList");

            try {
                const res = await fetch(API + "/tasks", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                const tasks = await res.json();

                if (tasks.length === 0) {
                    taskList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📋</div>
                            <p>No tasks yet. Add your first task above!</p>
                        </div>
                    `;
                } else {
                    taskList.innerHTML = tasks.map(task => `
                        <div class="task-item">
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-desc">${escapeHtml(task.description)}</div>
                        </div>
                    `).join("");
                }
            } catch (err) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <p>Could not load tasks. Check server connection.</p>
                    </div>
                `;
            }
        }

        // ===== ESCAPE HTML (Security) =====
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
