services:

  backend:
    build: .

    container_name: taskflow_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres

    env_file:
      - .env

  postgres:
    image: postgres:17

    container_name: taskflow_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: